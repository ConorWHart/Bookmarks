<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B2A1E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bookmarks</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/Bookmarks.UI/bookmarks.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Bookmarks.Client.styles.css" />
</head>

<body>
    <div id="app">
        <div class="bm-splash">
            <div class="bm-splash__books"><span></span><span></span><span></span><span></span></div>
            <div class="bm-splash__label">Bookmarks</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // Kept on window so js/pwa.js can watch for new versions once Blazor has started.
            window.bmSwRegistration = navigator.serviceWorker
                .register('service-worker.js', { updateViaCache: 'none' })
                .catch(err => { console.warn('Service worker registration failed', err); return null; });
        }
    </script>
</body>

</html>
